services:
  db:
    image: postgis/postgis:16-3.4
    container_name: postgis-cheatsheet
    environment:
      POSTGRES_DB: gis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"          # 5433 on the host so it does not clash with a local Postgres
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro   # 01_schema.sql, then 02_sample_data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gis"]
      interval: 3s
      timeout: 3s
      retries: 20
